syntax = "proto3";

package uni_track_source_stdds_plot_schema.proto.smes.position_report;

import "uni_track_plot_schema/proto/plot.proto";

/* ACRONYMS
 *
 * ASSC   - Airport Surface Surveillance Capability
 * ASDE-X - Airport Surface Detection Equipment Model X
 * ICAO   - International Civil Aviation Organization
 * ICD    - Interface Control Document
 * SMES   - Surface Movement Event Service
 * SFDPS  - SWIM Flight Data Publication Service
 * STDDS  - SWIM Terminal Data Distribution System
 */

/* A report published every second and containing the most recently received
 * movement data for the aircraft / vehicle. This may be a full report or a
 * partial update. This is generated by a CAT11 compacted binary position
 * report. The boolean attribute “full” can be set to indicate a full message.
 * If the “full” attribute is not set, the message contains only updates to
 * changed fields.
 *
 * Airport is denormalized from the larger message into the PositionReport.
 */
message PositionReport {
  uni_track_plot_schema.proto.plot.Common common = 1;

  bool is_full = 2; // Attribute indicating if this is a complete message or an update
  string airport = 3; // ICAO code of source airport
  uint32 seq_num = 4; // Sequence numbers are incremented each time a System Track Report is transmitted by ASDE-X or ASSC
  string time = 5; // Format: yyyy-mm-ddThh:mm:ss.sssZ
  uint32 track = 6; // The track number assigned to this aircraft/vehicle
  int64 stid = 7; // Unique identifier assigned by STDDS
  optional FlightId flight_id = 8;
  optional EnhancedData enhanced_data = 9;
  optional FlightInfo flight_info = 10;
  optional Manual manual = 11;
  optional Movement movement = 12;
  optional Position position = 13;
  optional Slc slc = 14;
  optional Status status = 15;
  optional TargetExtent target_extent = 16;
  optional uint32 plot_count = 17; // Plot number assigned by the source subsystem
  int64 position_timestamp = 18; // Microseconds since UNIX epoch, for BQ partitioning

  // Flight identification information
  message FlightId {
    string ac_address = 1; // Six hexadecimal digits
    string aircraft_id = 2; // Callsign associated with aircraft or vehicle. ANON when authorization flag is set to "anonymized" and UNKN when unknown.
    string mode_3_a_code = 3; // Mode 3A code of the flight. ANON when the authorization flag is set to "anonymized"
  }

  // Data derived from SFDPS flight plan to enhance SMES messages
  message EnhancedData {
    string eram_gufi = 1;
    string sfdps_gufi = 2;
    string departure_airport = 3; // Departure ICAO airport ID
    string destination_airport= 4; // Destination ICAO airport ID
    string aircraft_type = 5; // STDDS does not populate this field in SMES data
    string beacon_code = 6; // STDDS does not populate this field in SMES data
  }

  // Aggregation of flight information
  message FlightInfo {
    string ac_type = 1; // Aircraft type in ICAO format. "ANON" when authorization flag is set to "anonymized"
    string fix = 2; // Exit fix, typically as three-letter airport code, for arrival flights, derived from the flight plan
    string runway = 3; // Departure or arrival runway name. This field can also contain the keyword "filtered" or "unassigned"
    TargetType tgt_type = 4;
    string wake = 5; // Wake class of the airframe

    enum TargetType {
      TT_UNSPECIFIED = 0;
      TT_UNKNOWN = 1;
      TT_AIRCRAFT = 2;
      TT_VEHICLE = 3;
      TT_UNKNOWN_AIRCRAFT = 4;
    }
  }

  // Contains manually entered fields
  message Manual {
    string ac_type = 1; // Aircraft type in ICAO format. "ANON" when authorization flag is set to "anonymized".
    string call_num = 2; // Callsign associated with target. "ANON" when authorization flag is set to "anonymized".
    string category = 3; // Wake vortex class
    string fix = 4; // Paired fix
    string mode_3_a_code = 5; // Mode 3A code of the flight. ANON when the authorization flag is set to "anonymized"
    string scratchpad_1 = 6; // First line of free form text obtained via manual tag
    string scratchpad_2 = 7; // Second line of free form text obtained via manual tag
  }

  // Aggregation of movement information
  message Movement {
    optional double ax = 1; // Calculated X component of the fused track acceleration in m/sec2
    optional double ay = 2; // Calculated Y component of the fused track acceleration in m/sec2
    optional double heading = 3; // Smoothed heading relative to true North of the vehicle/aircraft
    optional int32 speed = 4; // Smoothed speed of the vehicle/aircraft in knots
    optional double vx = 5; // The calculated X component of the aircraft velocity in m/sec
    optional double vy = 6; // The calculated Y component of the aircraft velocity in m/sec
  }

  // Aggregation of position information
  message Position {
    optional double altitude = 1; // In feet above MSL of the fused track
    optional int32 extended_x = 2; // X component of the Cartesian coordinates for aircraft over 17NM from the airport
    optional int32 extended_y = 3; // Y component of the Cartesian coordinates for aircraft over 17NM from the airport
    optional double flight_level = 4;
    double latitude = 5;
    double longitude = 6;
    optional int32 x = 7; // The X component of the Cartesian coordinates
    optional int32 y = 8; // The Y component of the Cartesian coordinates
  }

  // Contains the ASDE-X or ASSC internal table indices for various flight states
  message Slc {
    optional uint32 coast_num = 1; // Coasted track number
    optional uint32 local_av_num = 2; // Local aircraft vehicle list number
    optional uint32 susp_num = 3; // Suspended track number
  }

  // Aggregation of status information
  message Status {
    optional uint32 a9s = 1; // Set to one if the ASR9 source fused bit is set to true
    AlertFilter af = 2;
    optional uint32 ap = 3; // Set to one if the coast in apron bit is set to true
    optional uint32 aq = 4; // Set to one if the coast association question indicator bit is set to true
    AddressQualifier aq1090 = 5;
    AddressQualifier aq_uat = 6;
    optional uint32 as = 7; // Set to one if the ADSB source fused bit is set to true
    optional uint32 at = 8; // Set to one if the ATCRBS source fused bit is set to true
    optional uint32 da = 9; // Set to one if the duplicate discrete mode A indicator is set to true
    optional uint32 df = 10; // Duplicate flight indicator set to one if the df bit is set to true
    optional uint32 di = 11; // Set to one if the display indicator bit is set to true
    optional uint32 gbs = 12; // Set to one if the aircraft is not on the ground
    optional uint32 gm = 13; // Set to one if the GPS position is more than 100 feet from the multilaterated position
    optional uint32 ls = 14; // Set to one if the lost coast sensor support indicator bit is set to true
    optional uint32 lv = 15; // Set to one if the local vehicle association bit is set to true
    optional uint32 lv_1090 = 16; // Derived from expansion field 1090LV link version
    optional uint32 lv_uat = 17; // Derived from expansion field UATLV link version
    optional uint32 m3c = 18; // Set to one if the mode 3/A code has changed
    optional uint32 mon = 19; // Set to one if the track is a monosensor track
    AltitudeDerivationSource mrh = 20; // Indicates if the reported altitude is "barometric" or "geometric"
    optional uint32 ms = 21; // Set to one if the Mode S source fused bit is set to true
    optional uint32 nc = 22; // Set to one if the multipath non-cooperative bit is set to true
    optional uint32 op = 23; // Set to one if the coast in oscillation period indicator bit is set to true
    optional uint32 quality = 24;
    optional uint32 rt = 25; // Set to one if the reference transmitter track bit is set to true
    optional uint32 s1 = 26; // Set to one if the SBS 1090ES ADSB source was fused for this track
    optional uint32 si = 27; // Binary value indicating if the safety logic processing has been inhibited on the track bit
    optional uint32 sim = 28; // Set to one if the data is in engineering playback mode, set to zero if the track is from live data
    optional uint32 spi = 29; // Set to one if the last report contained a Special Purpose Indicator
    FusedHeightSource src = 30;
    optional uint32 ss = 31; // Set to one if the SMR source fused bit is set to true
    optional uint32 st = 32; // Set to one if the suspended track indicator bit is set to true
    optional uint32 su = 33; // Set to one if the SBS UAT ADSB source was fused for this track
    optional uint32 tc = 34; // Set to one if the manual/automatic tag conflict indicator bit is set to true
    optional uint32 tf = 35; // Set to one if the Taxiway Arrival Alert Filtered bit is set to true
    optional uint32 twy_id = 36; // Predicted Taxiway ID
    optional uint32 aa = 37; // Set to one if the ADSB associated flag is set to true
    CoordinateValidationStatus av = 38;
    optional uint32 sil = 39; // Source integrity level
    optional uint32 nic = 40; // Navigation integrity category
    optional uint32 nacp = 41; // Navigation accuracy category for position
    AltitudeDerivationSource vs = 42; // Source of data used to compute the vertical rate
    Direction ud = 43; // Vertical rate direction
    optional uint32 vert_rate = 44; // Vertical rate of the current track
    optional sint32 uncorr_baro_alt = 45; // Most recent barometric pressure altitude reported by the aircraft
    optional uint32 tse = 46; // Set to one if this were the last message of the track
    optional uint32 ua = 47; // Set to one if the UAT source was fused for this track
    optional uint32 x = 48; // Set to one if the ATCRBS X bit is set

    enum AlertFilter {
      AF_UNSPECIFIED = 0;
      AF_UNFILTERED = 1;
      AF_FILTERED = 2;
      AF_HIGHLIGHT = 3;
    }

    enum AddressQualifier {
      AQ_UNSPECIFIED = 0;
      AQ_ADSBICAO = 1;
      AQ_ADSBSA = 2;
      AQ_TISBICAO = 3;
      AQ_TISBTFI = 4;
      AQ_VEHICLE = 5;
      AQ_BEACON = 6;
    }

    enum AltitudeDerivationSource {
      ADS_UNSPECIFIED = 0;
      ADS_BAROMETRIC = 1;
      ADS_GEOMETRIC = 2;
    }

    enum FusedHeightSource {
      FHS_UNSPECIFIED = 0;
      FHS_NONE = 1;
      FHS_ADSB = 2;
      FHS_MODEC = 3;
      FHS_MULTILAT = 4;
      FHS_GROUND = 5;
      FHS_MULTIPLE = 6;
    }

    enum CoordinateValidationStatus {
      CVS_UNSPECIFIED = 0;
      CVS_UNKNOWN = 1;
      CVS_INVALID = 2;
      CVS_RESERVED = 3;
      CVS_VALID = 4;
    }

    enum Direction {
      DIRECTION_UNSPECIFIED = 0;
      DIRECTION_UP = 1;
      DIRECTION_DOWN = 2;
    }
  }

  // Aggregation of target extent information
  message TargetExtent {
    optional double start_azimuth = 1;
    optional uint32 start_range = 2;
    optional double end_azimuth = 3;
    optional uint32 end_range = 4;
    optional uint32 estimate = 5; // Corresponds to the Extent field in the ASDE-X and ASSC ICDs
  }
}

